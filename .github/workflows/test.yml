name: Tests

on:
  push:
    branches: [main, "arena/*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/telegram.test.js

  level-pipeline-probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/e5deedb5-movie-words-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {language: es, level: B1}
          - {language: fr, level: B2}
          - {language: pt, level: C1}
          - {language: de, level: C2}
          - {language: hi, level: A2}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - run: python scripts/probe_pipeline_live.py ${{ matrix.language }} ${{ matrix.level }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
