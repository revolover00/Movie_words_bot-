name: Tests

on:
  push:
    branches: [main, "arena/*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/telegram.test.js

  inspect-player:
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/e5deedb5-movie-words-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/inspect_clip_player.py
