name: Daily Word

on:
  repository_dispatch:
    types: [daily-word]
  workflow_dispatch:
    inputs:
      probe_yarn:
        description: Test Yarn without sending messages
        type: boolean
        default: false

concurrency:
  group: movie-expressions
  cancel-in-progress: false

jobs:
  probe-yarn:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_yarn }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe_yarn.py

  send:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.probe_yarn }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install media tools and Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Run daily job
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
        run: python scripts/run_daily_with_diagnostics.py
